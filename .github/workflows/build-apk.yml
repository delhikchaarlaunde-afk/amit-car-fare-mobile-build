
name: Build Amit Car Fare APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -q Amit_Car_Fare_OTP_LOGIN_ADDED.zip -d project

      - name: Build APK
        run: gradle --no-daemon -p project/AmitCarFare_OfflineMap assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amit-Car-Fare-APK
          path: project/AmitCarFare_OfflineMap/app/build/outputs/apk/debug/app-debug.apk
